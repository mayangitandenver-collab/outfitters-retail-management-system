                  grid-template-columns: 1fr;
              }

              .employee-performance-table.table-header,
              .attendance-alert-table.table-header {
                  display: none;
              }
          }
          EOF

      - name: Normalize Razor directives
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/Outfitters.Web")
          pattern = re.compile(
              r"^\s*@(page|attribute|inject|using|namespace|inherits|layout|"
              r"implements|typeparam|rendermode)\b"
          )

          for path in root.rglob("*.razor"):
              lines = path.read_text(encoding="utf-8-sig").splitlines()
              normalized = [
                  line.lstrip() if pattern.match(line) else line
                  for line in lines
              ]

              path.write_text(
                  "\n".join(normalized).rstrip() + "\n",
                  encoding="utf-8"
              )
          PY

      - name: Restore build and test
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore OutfittersRetailManagementSystem.sln
          dotnet build OutfittersRetailManagementSystem.sln \
            --configuration Release \
            --no-restore
          dotnet test OutfittersRetailManagementSystem.sln \
            --configuration Release \
            --no-build

      - name: Commit milestone 20
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/Outfitters.Web

          if git diff --cached --quiet
          then
            echo "Milestone 20 is already committed."
            exit 0
          fi

          git commit -m \
            "Milestone 20 - Add employee and HR management UI"

          for attempt in 1 2 3
          do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main
            then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]
            then
              sleep 5
            fi
          done

          echo "Unable to push Milestone 20 after three attempts."
          exit 1
