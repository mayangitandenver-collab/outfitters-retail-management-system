name: ORMS Milestone 13 - Web UI Foundation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  milestone13:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Create Blazor web application if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "src/Outfitters.Web/Outfitters.Web.csproj" ]
          then
            dotnet new blazor \
              --name Outfitters.Web \
              --output src/Outfitters.Web \
              --framework net9.0 \
              --interactivity Server \
              --all-interactive \
              --no-https

            dotnet sln OutfittersRetailManagementSystem.sln add \
              src/Outfitters.Web/Outfitters.Web.csproj
          else
            echo "Outfitters.Web already exists; skipping project creation."
          fi

      - name: Write web application configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/Outfitters.Web/Models
          mkdir -p src/Outfitters.Web/Services
          mkdir -p src/Outfitters.Web/Components/Layout
          mkdir -p src/Outfitters.Web/Components/Pages
          mkdir -p src/Outfitters.Web/wwwroot/css

          cat > src/Outfitters.Web/appsettings.json <<'EOF'
          {
            "Api": {
              "BaseUrl": "http://localhost:8080"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*"
          }
          EOF

          cat > src/Outfitters.Web/Models/DashboardSummary.cs <<'EOF'
          namespace Outfitters.Web.Models;

          public sealed class DashboardSummary
          {
              public decimal TodaySales { get; set; }
              public decimal MonthSales { get; set; }
              public decimal InventoryValue { get; set; }
              public int LowStockCount { get; set; }
              public int ActiveCustomers { get; set; }
              public int TransactionsToday { get; set; }
              public IReadOnlyCollection<DashboardMetric> SalesTrend { get; set; } =
                  Array.Empty<DashboardMetric>();
              public IReadOnlyCollection<TopProductItem> TopProducts { get; set; } =
                  Array.Empty<TopProductItem>();
          }

          public sealed class DashboardMetric
          {
              public string Label { get; set; } = string.Empty;
              public decimal Value { get; set; }
          }

          public sealed class TopProductItem
          {
              public string Name { get; set; } = string.Empty;
              public decimal Quantity { get; set; }
              public decimal SalesAmount { get; set; }
          }
          EOF

          cat > src/Outfitters.Web/Models/LoginRequest.cs <<'EOF'
          namespace Outfitters.Web.Models;

          public sealed class LoginRequest
          {
              public string Email { get; set; } = string.Empty;
              public string Password { get; set; } = string.Empty;
              public bool RememberMe { get; set; }
          }

          public sealed class LoginResult
          {
              public string AccessToken { get; set; } = string.Empty;
              public string? RefreshToken { get; set; }
              public DateTime? ExpiresAtUtc { get; set; }
          }
          EOF

          cat > src/Outfitters.Web/Services/ApiClient.cs <<'EOF'
          using System.Net.Http.Json;
          using Outfitters.Web.Models;

          namespace Outfitters.Web.Services;

          public interface IApiClient
          {
              Task<LoginResult?> LoginAsync(
                  LoginRequest request,
                  CancellationToken cancellationToken = default);

              Task<DashboardSummary> GetDashboardAsync(
                  CancellationToken cancellationToken = default);
          }

          public sealed class ApiClient : IApiClient
          {
              private readonly HttpClient _httpClient;

              public ApiClient(HttpClient httpClient)
              {
                  _httpClient = httpClient;
              }

              public async Task<LoginResult?> LoginAsync(
                  LoginRequest request,
                  CancellationToken cancellationToken = default)
              {
                  using var response = await _httpClient.PostAsJsonAsync(
                      "/api/auth/login",
                      request,
                      cancellationToken);

                  if (!response.IsSuccessStatusCode)
                  {
                      return null;
                  }

                  return await response.Content.ReadFromJsonAsync<LoginResult>(
                      cancellationToken: cancellationToken);
              }

              public async Task<DashboardSummary> GetDashboardAsync(
                  CancellationToken cancellationToken = default)
              {
                  try
                  {
                      var result = await _httpClient.GetFromJsonAsync<DashboardSummary>(
                          "/api/reports/dashboard",
                          cancellationToken);

                      return result ?? CreateFallback();
                  }
                  catch
                  {
                      return CreateFallback();
                  }
              }

              private static DashboardSummary CreateFallback()
              {
                  return new DashboardSummary
                  {
                      TodaySales = 0m,
                      MonthSales = 0m,
                      InventoryValue = 0m,
                      LowStockCount = 0,
                      ActiveCustomers = 0,
                      TransactionsToday = 0,
                      SalesTrend = Array.Empty<DashboardMetric>(),
                      TopProducts = Array.Empty<TopProductItem>()
                  };
              }
          }
          EOF

      - name: Configure web application services
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Web/Program.cs <<'EOF'
          using Outfitters.Web.Components;
          using Outfitters.Web.Services;

          var builder = WebApplication.CreateBuilder(args);

          builder.Services
              .AddRazorComponents()
              .AddInteractiveServerComponents();

          var apiBaseUrl = builder.Configuration["Api:BaseUrl"]
              ?? "http://localhost:8080";

          builder.Services.AddHttpClient<IApiClient, ApiClient>(client =>
          {
              client.BaseAddress = new Uri(apiBaseUrl);
              client.Timeout = TimeSpan.FromSeconds(30);
          });

          var app = builder.Build();

          if (!app.Environment.IsDevelopment())
          {
              app.UseExceptionHandler("/Error", createScopeForErrors: true);
              app.UseHsts();
          }

          app.UseStaticFiles();
          app.UseAntiforgery();

          app.MapRazorComponents<App>()
              .AddInteractiveServerRenderMode();

          app.Run();
          EOF

      - name: Write application shell and navigation
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Web/Components/App.razor <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <base href="/" />
              <link rel="stylesheet" href="css/site.css" />
              <HeadOutlet />
          </head>
          <body>
              <Routes />
              <script src="_framework/blazor.web.js"></script>
          </body>
          </html>
          EOF

          cat > src/Outfitters.Web/Components/Routes.razor <<'EOF'
          <Router AppAssembly="typeof(Program).Assembly">
              <Found Context="routeData">
                  <RouteView RouteData="routeData" DefaultLayout="typeof(Layout.MainLayout)" />
                  <FocusOnNavigate RouteData="routeData" Selector="h1" />
              </Found>
              <NotFound>
                  <LayoutView Layout="typeof(Layout.MainLayout)">
                      <div class="page-card">
                          <h1>Page not found</h1>
                          <p>The requested ORMS page does not exist.</p>
                      </div>
                  </LayoutView>
              </NotFound>
          </Router>
          EOF

          cat > src/Outfitters.Web/Components/_Imports.razor <<'EOF'
          @using System.Net.Http.Json
          @using Microsoft.AspNetCore.Components.Forms
          @using Microsoft.AspNetCore.Components.Routing
          @using Microsoft.AspNetCore.Components.Web
          @using Microsoft.AspNetCore.Components.Web.Virtualization
          @using Microsoft.JSInterop
          @using Outfitters.Web
          @using Outfitters.Web.Components
          @using Outfitters.Web.Models
          @using Outfitters.Web.Services
          EOF

          cat > src/Outfitters.Web/Components/Layout/MainLayout.razor <<'EOF'
          @inherits LayoutComponentBase

          <div class="app-shell">
              <aside class="sidebar">
                  <div class="brand">
                      <div class="brand-mark">O</div>
                      <div>
                          <strong>OUTFITTERS</strong>
                          <span>Retail Management</span>
                      </div>
                  </div>

                  <nav class="navigation">
                      <NavLink href="/" Match="NavLinkMatch.All">Dashboard</NavLink>
                      <NavLink href="/pos">Point of Sale</NavLink>
                      <NavLink href="/inventory">Inventory</NavLink>
                      <NavLink href="/customers">Customers</NavLink>
                      <NavLink href="/employees">Employees</NavLink>
                      <NavLink href="/finance">Finance</NavLink>
                      <NavLink href="/reports">Reports</NavLink>
                      <NavLink href="/settings">Settings</NavLink>
                  </nav>
              </aside>

              <main class="main-area">
                  <header class="topbar">
                      <div>
                          <span class="store-label">Current store</span>
                          <strong>Main Branch</strong>
                      </div>
                      <div class="topbar-actions">
                          <button type="button" class="ghost-button">Notifications</button>
                          <div class="user-chip">Administrator</div>
                      </div>
                  </header>

                  <section class="content-area">
                      @Body
                  </section>
              </main>
          </div>
          EOF

      - name: Write login and dashboard pages
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Web/Components/Pages/Login.razor <<'EOF'
          @page "/login"
          @inject IApiClient ApiClient
          @inject NavigationManager Navigation

          <PageTitle>Login - OUTFITTERS</PageTitle>

          <div class="login-page">
              <div class="login-panel">
                  <div class="brand login-brand">
                      <div class="brand-mark">O</div>
                      <div>
                          <strong>OUTFITTERS</strong>
                          <span>Retail Management System</span>
                      </div>
                  </div>

                  <h1>Welcome back</h1>
                  <p>Sign in to continue to your store dashboard.</p>

                  <EditForm Model="_request" OnValidSubmit="SubmitAsync">
                      <DataAnnotationsValidator />

                      <label>
                          Email address
                          <InputText @bind-Value="_request.Email" />
                      </label>

                      <label>
                          Password
                          <InputText @bind-Value="_request.Password" type="password" />
                      </label>

                      <label class="checkbox-row">
                          <InputCheckbox @bind-Value="_request.RememberMe" />
                          Remember me
                      </label>

                      @if (!string.IsNullOrWhiteSpace(_error))
                      {
                          <div class="error-message">@_error</div>
                      }

                      <button class="primary-button" disabled="@_busy">
                          @(_busy ? "Signing in..." : "Sign in")
                      </button>
                  </EditForm>
              </div>
          </div>

          @code {
              private readonly LoginRequest _request = new();
              private bool _busy;
              private string? _error;

              private async Task SubmitAsync()
              {
                  _busy = true;
                  _error = null;

                  var result = await ApiClient.LoginAsync(_request);

                  if (result is null || string.IsNullOrWhiteSpace(result.AccessToken))
                  {
                      _error = "The email or password is incorrect.";
                      _busy = false;
                      return;
                  }

                  Navigation.NavigateTo("/");
              }
          }
          EOF

          cat > src/Outfitters.Web/Components/Pages/Home.razor <<'EOF'
          @page "/"
          @inject IApiClient ApiClient

          <PageTitle>Dashboard - OUTFITTERS</PageTitle>

          <div class="page-heading">
              <div>
                  <span class="eyebrow">Overview</span>
                  <h1>Store Dashboard</h1>
                  <p>Live retail performance and operational alerts.</p>
              </div>
              <button class="primary-button compact">New Sale</button>
          </div>

          @if (_loading)
          {
              <div class="page-card">Loading dashboard...</div>
          }
          else
          {
              <div class="metric-grid">
                  <article class="metric-card">
                      <span>Today's Sales</span>
                      <strong>@_summary.TodaySales.ToString("C")</strong>
                  </article>
                  <article class="metric-card">
                      <span>Monthly Sales</span>
                      <strong>@_summary.MonthSales.ToString("C")</strong>
                  </article>
                  <article class="metric-card">
                      <span>Inventory Value</span>
                      <strong>@_summary.InventoryValue.ToString("C")</strong>
                  </article>
                  <article class="metric-card alert-card">
                      <span>Low Stock Items</span>
                      <strong>@_summary.LowStockCount</strong>
                  </article>
                  <article class="metric-card">
                      <span>Active Customers</span>
                      <strong>@_summary.ActiveCustomers</strong>
                  </article>
                  <article class="metric-card">
                      <span>Transactions Today</span>
                      <strong>@_summary.TransactionsToday</strong>
                  </article>
              </div>

              <div class="dashboard-grid">
                  <section class="page-card">
                      <div class="section-heading">
                          <h2>Sales trend</h2>
                          <span>Current month</span>
                      </div>

                      @if (_summary.SalesTrend.Count == 0)
                      {
                          <div class="empty-state">Sales data will appear here.</div>
                      }
                      else
                      {
                          <div class="trend-list">
                              @foreach (var item in _summary.SalesTrend)
                              {
                                  <div>
                                      <span>@item.Label</span>
                                      <strong>@item.Value.ToString("C")</strong>
                                  </div>
                              }
                          </div>
                      }
                  </section>

                  <section class="page-card">
                      <div class="section-heading">
                          <h2>Top products</h2>
                          <span>By sales</span>
                      </div>

                      @if (_summary.TopProducts.Count == 0)
                      {
                          <div class="empty-state">Top-selling products will appear here.</div>
                      }
                      else
                      {
                          <div class="product-list">
                              @foreach (var item in _summary.TopProducts)
                              {
                                  <div>
                                      <span>@item.Name</span>
                                      <strong>@item.SalesAmount.ToString("C")</strong>
                                  </div>
                              }
                          </div>
                      }
                  </section>
              </div>
          }

          @code {
              private DashboardSummary _summary = new();
              private bool _loading = true;

              protected override async Task OnInitializedAsync()
              {
                  _summary = await ApiClient.GetDashboardAsync();
                  _loading = false;
              }
          }
          EOF

      - name: Write module placeholder pages
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/write-page.sh <<'EOF'
          set -euo pipefail
          page="$1"
          route="$2"
          title="$3"
          description="$4"

          cat > "src/Outfitters.Web/Components/Pages/${page}.razor" <<PAGE
          @page "/${route}"

          <PageTitle>${title} - OUTFITTERS</PageTitle>

          <div class="page-heading">
              <div>
                  <span class="eyebrow">Module</span>
                  <h1>${title}</h1>
                  <p>${description}</p>
              </div>
          </div>

          <section class="page-card">
              <div class="empty-state">
                  The ${title} workspace is ready for the next UI sprint.
              </div>
          </section>
          PAGE
          EOF

          bash /tmp/write-page.sh Pos pos "Point of Sale" \
            "Scan products, build carts, accept payments, and print receipts."
          bash /tmp/write-page.sh Inventory inventory "Inventory" \
            "Manage products, variants, stock levels, receiving, and transfers."
          bash /tmp/write-page.sh Customers customers "Customers" \
            "Manage customer profiles, loyalty points, and purchase history."
          bash /tmp/write-page.sh Employees employees "Employees" \
            "Manage staff accounts, attendance, roles, and permissions."
          bash /tmp/write-page.sh Finance finance "Finance" \
            "Review journals, expenses, balances, and accounting reports."
          bash /tmp/write-page.sh Reports reports "Reports" \
            "Review sales, inventory, customer, and operational reports."
          bash /tmp/write-page.sh Settings settings "Settings" \
            "Configure stores, printers, integrations, taxes, and system options."

      - name: Write industrial UI styles
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Web/wwwroot/css/site.css <<'EOF'
          :root {
              font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              color: #f7f7f8;
              background: #101114;
              font-synthesis: none;
          }

          * {
              box-sizing: border-box;
          }

          body {
              margin: 0;
              min-width: 320px;
              min-height: 100vh;
              background:
                  radial-gradient(circle at top right, rgba(215, 151, 64, 0.12), transparent 32rem),
                  #101114;
          }

          button,
          input {
              font: inherit;
          }

          .app-shell {
              min-height: 100vh;
              display: grid;
              grid-template-columns: 260px 1fr;
          }

          .sidebar {
              padding: 24px 18px;
              border-right: 1px solid #292b31;
              background: #15171b;
          }

          .brand {
              display: flex;
              align-items: center;
              gap: 12px;
          }

          .brand-mark {
              width: 46px;
              height: 46px;
              display: grid;
              place-items: center;
              border: 1px solid #d79a48;
              border-radius: 12px;
              color: #d79a48;
              font-weight: 900;
              font-size: 24px;
          }

          .brand strong,
          .brand span {
              display: block;
          }

          .brand span {
              margin-top: 2px;
              color: #8e929c;
              font-size: 12px;
          }

          .navigation {
              margin-top: 34px;
              display: grid;
              gap: 6px;
          }

          .navigation a {
              padding: 12px 14px;
              border-radius: 10px;
              color: #aaadb5;
              text-decoration: none;
          }

          .navigation a.active,
          .navigation a:hover {
              color: #fff;
              background: #24272d;
          }

          .main-area {
              min-width: 0;
          }

          .topbar {
              height: 78px;
              padding: 0 30px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              border-bottom: 1px solid #292b31;
              background: rgba(16, 17, 20, 0.9);
          }

          .store-label {
              display: block;
              color: #8e929c;
              font-size: 12px;
          }

          .topbar-actions {
              display: flex;
              align-items: center;
              gap: 12px;
          }

          .user-chip,
          .ghost-button {
              padding: 10px 14px;
              border: 1px solid #33363d;
              border-radius: 999px;
              color: #d7d9de;
              background: transparent;
          }

          .content-area {
              padding: 30px;
          }

          .page-heading {
              display: flex;
              align-items: flex-start;
              justify-content: space-between;
              gap: 20px;
              margin-bottom: 24px;
          }

          .page-heading h1 {
              margin: 4px 0 8px;
              font-size: clamp(28px, 4vw, 42px);
          }

          .page-heading p {
              margin: 0;
              color: #979aa3;
          }

          .eyebrow {
              color: #d79a48;
              font-size: 12px;
              font-weight: 800;
              letter-spacing: 0.12em;
              text-transform: uppercase;
          }

          .primary-button {
              width: 100%;
              padding: 12px 18px;
              border: 0;
              border-radius: 10px;
              background: #d79a48;
              color: #111216;
              font-weight: 800;
              cursor: pointer;
          }

          .primary-button.compact {
              width: auto;
          }

          .metric-grid {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 16px;
              margin-bottom: 20px;
          }

          .metric-card,
          .page-card {
              border: 1px solid #2c2f36;
              border-radius: 14px;
              background: #181a1f;
              box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
          }

          .metric-card {
              padding: 20px;
          }

          .metric-card span {
              display: block;
              color: #92969f;
              font-size: 13px;
          }

          .metric-card strong {
              display: block;
              margin-top: 10px;
              font-size: 28px;
          }

          .alert-card strong {
              color: #e2a04c;
          }

          .dashboard-grid {
              display: grid;
              grid-template-columns: 1.5fr 1fr;
              gap: 18px;
          }

          .page-card {
              padding: 22px;
          }

          .section-heading {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 16px;
              margin-bottom: 18px;
          }

          .section-heading h2 {
              margin: 0;
          }

          .section-heading span {
              color: #8e929c;
              font-size: 13px;
          }

          .trend-list,
          .product-list {
              display: grid;
              gap: 12px;
          }

          .trend-list div,
          .product-list div {
              display: flex;
              justify-content: space-between;
              padding-bottom: 12px;
              border-bottom: 1px solid #2a2d34;
          }

          .empty-state {
              min-height: 180px;
              display: grid;
              place-items: center;
              color: #777b85;
              text-align: center;
          }

          .login-page {
              min-height: 100vh;
              display: grid;
              place-items: center;
              padding: 24px;
          }

          .login-panel {
              width: min(100%, 430px);
              padding: 34px;
              border: 1px solid #2d3037;
              border-radius: 18px;
              background: rgba(24, 26, 31, 0.96);
              box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
          }

          .login-brand {
              margin-bottom: 32px;
          }

          .login-panel h1 {
              margin-bottom: 8px;
          }

          .login-panel > p {
              margin-top: 0;
              color: #92969f;
          }

          .login-panel form {
              margin-top: 26px;
              display: grid;
              gap: 16px;
          }

          .login-panel label {
              display: grid;
              gap: 8px;
              color: #c6c8ce;
          }

          .login-panel input[type="text"],
          .login-panel input[type="password"] {
              width: 100%;
              padding: 12px 14px;
              border: 1px solid #343740;
              border-radius: 10px;
              color: #fff;
              background: #111317;
              outline: none;
          }

          .login-panel input:focus {
              border-color: #d79a48;
          }

          .checkbox-row {
              display: flex !important;
              align-items: center;
              gap: 10px !important;
          }

          .error-message {
              padding: 10px 12px;
              border: 1px solid #793a3a;
              border-radius: 8px;
              color: #ffb6b6;
              background: #321b1b;
          }

          @media (max-width: 980px) {
              .app-shell {
                  grid-template-columns: 1fr;
              }

              .sidebar {
                  display: none;
              }

              .metric-grid {
                  grid-template-columns: repeat(2, minmax(0, 1fr));
              }

              .dashboard-grid {
                  grid-template-columns: 1fr;
              }
          }

          @media (max-width: 620px) {
              .topbar,
              .content-area {
                  padding-left: 18px;
                  padding-right: 18px;
              }

              .metric-grid {
                  grid-template-columns: 1fr;
              }

              .page-heading {
                  flex-direction: column;
              }
          }
          EOF

      - name: Restore build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore OutfittersRetailManagementSystem.sln
          dotnet build OutfittersRetailManagementSystem.sln \
            --configuration Release \
            --no-restore
          dotnet test OutfittersRetailManagementSystem.sln \
            --configuration Release \
            --no-build

      - name: Commit milestone 13
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/Outfitters.Web \
            OutfittersRetailManagementSystem.sln

          if git diff --cached --quiet
          then
            echo "Milestone 13 files are already committed; nothing to push."
            exit 0
          fi

          git commit -m "Milestone 13 - Add web UI foundation"

          for attempt in 1 2 3
          do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main
            then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]
            then
              sleep 5
            fi
          done

          echo "Unable to push Milestone 13 after three attempts."
          exit 1
