          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 9.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add AddPurchasingAndSuppliers \
            --project src/Outfitters.Infrastructure/Outfitters.Infrastructure.csproj \
            --startup-project src/Outfitters.API/Outfitters.API.csproj \
            --output-dir Persistence/Migrations

