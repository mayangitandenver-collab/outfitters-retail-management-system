name: ORMS Milestone 17 - Inventory Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  milestone17:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Add inventory intelligence models
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/Outfitters.Web/Models
          mkdir -p src/Outfitters.Web/Services
          mkdir -p src/Outfitters.Web/Components/Pages

          cat > src/Outfitters.Web/Models/InventoryIntelligenceModels.cs <<'EOF'
          namespace Outfitters.Web.Models;

          public sealed class InventoryIntelligenceSummary
          {
              public decimal TotalInventoryValue { get; set; }
              public int LowStockItemCount { get; set; }
              public int OutOfStockItemCount { get; set; }
              public int DeadStockItemCount { get; set; }
              public int ReorderSuggestionCount { get; set; }
              public decimal EstimatedThirtyDayDemand { get; set; }

              public IReadOnlyCollection<InventoryInsightItem> LowStockItems { get; set; } =
                  Array.Empty<InventoryInsightItem>();

              public IReadOnlyCollection<InventoryInsightItem> FastMovingItems { get; set; } =
                  Array.Empty<InventoryInsightItem>();

              public IReadOnlyCollection<InventoryInsightItem> DeadStockItems { get; set; } =
                  Array.Empty<InventoryInsightItem>();

              public IReadOnlyCollection<ReorderSuggestionItem> ReorderSuggestions { get; set; } =
                  Array.Empty<ReorderSuggestionItem>();

              public IReadOnlyCollection<BranchInventoryComparisonItem> BranchComparison { get; set; } =
                  Array.Empty<BranchInventoryComparisonItem>();
          }

          public sealed class InventoryInsightItem
          {
              public Guid ProductVariantId { get; set; }
              public string ProductName { get; set; } = string.Empty;
              public string VariantName { get; set; } = string.Empty;
              public string StoreName { get; set; } = string.Empty;
              public decimal QuantityOnHand { get; set; }
              public decimal ReorderLevel { get; set; }
              public decimal UnitsSoldThirtyDays { get; set; }
              public decimal DaysOfCover { get; set; }
              public string Classification { get; set; } = "C";
          }

          public sealed class ReorderSuggestionItem
          {
              public Guid ProductVariantId { get; set; }
              public string ProductName { get; set; } = string.Empty;
              public string VariantName { get; set; } = string.Empty;
              public string StoreName { get; set; } = string.Empty;
              public string SupplierName { get; set; } = string.Empty;
              public decimal QuantityOnHand { get; set; }
              public decimal SuggestedOrderQuantity { get; set; }
              public decimal EstimatedUnitCost { get; set; }
              public decimal EstimatedOrderValue =>
                  SuggestedOrderQuantity * EstimatedUnitCost;
          }

          public sealed class BranchInventoryComparisonItem
          {
              public Guid StoreId { get; set; }
              public string StoreName { get; set; } = string.Empty;
              public decimal InventoryValue { get; set; }
              public int ActiveSkuCount { get; set; }
              public int LowStockCount { get; set; }
              public int OutOfStockCount { get; set; }
              public decimal ThirtyDaySellThroughRate { get; set; }
          }

          public sealed class CreatePurchaseRecommendationRequest
          {
              public Guid StoreId { get; set; }
              public IReadOnlyCollection<CreatePurchaseRecommendationLine> Lines { get; set; } =
                  Array.Empty<CreatePurchaseRecommendationLine>();
          }

          public sealed class CreatePurchaseRecommendationLine
          {
              public Guid ProductVariantId { get; set; }
              public decimal Quantity { get; set; }
          }
          EOF

      - name: Add inventory intelligence API client
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Web/Services/InventoryIntelligenceApiClient.cs <<'EOF'
          using System.Net.Http.Json;
          using Outfitters.Web.Models;

          namespace Outfitters.Web.Services;

          public interface IInventoryIntelligenceApiClient
          {
              Task<InventoryIntelligenceSummary> GetSummaryAsync(
                  Guid? storeId,
                  CancellationToken cancellationToken = default);

              Task<bool> CreatePurchaseRecommendationAsync(
                  CreatePurchaseRecommendationRequest request,
                  CancellationToken cancellationToken = default);
          }

          public sealed class InventoryIntelligenceApiClient
              : IInventoryIntelligenceApiClient
          {
              private readonly HttpClient _httpClient;

              public InventoryIntelligenceApiClient(HttpClient httpClient)
              {
                  _httpClient = httpClient;
              }

              public async Task<InventoryIntelligenceSummary> GetSummaryAsync(
                  Guid? storeId,
                  CancellationToken cancellationToken = default)
              {
                  var path = storeId.HasValue
                      ? $"/api/inventory/intelligence?storeId={storeId.Value}"
                      : "/api/inventory/intelligence";

                  try
                  {
                      return await _httpClient
                          .GetFromJsonAsync<InventoryIntelligenceSummary>(
                              path,
                              cancellationToken)
                          ?? new InventoryIntelligenceSummary();
                  }
                  catch
                  {
                      return new InventoryIntelligenceSummary();
                  }
              }

              public async Task<bool> CreatePurchaseRecommendationAsync(
                  CreatePurchaseRecommendationRequest request,
                  CancellationToken cancellationToken = default)
              {
                  using var response = await _httpClient.PostAsJsonAsync(
                      "/api/purchasing/recommendations",
                      request,
                      cancellationToken);

                  return response.IsSuccessStatusCode;
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Outfitters.Web/Program.cs")
          text = path.read_text()

          registration = """builder.Services
              .AddHttpClient<IInventoryIntelligenceApiClient, InventoryIntelligenceApiClient>(client =>
              {
                  client.BaseAddress = new Uri(apiBaseUrl);
                  client.Timeout = TimeSpan.FromSeconds(30);
              })
              .AddHttpMessageHandler<BearerTokenHandler>();

          """

          if "IInventoryIntelligenceApiClient" not in text:
              marker = "var app = builder.Build();"
              index = text.find(marker)

              if index == -1:
                  raise SystemExit("Program.cs application marker not found")

              text = text[:index] + registration + text[index:]

          path.write_text(text)
          PY

      - name: Add inventory intelligence dashboard
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Web/Components/Pages/InventoryIntelligence.razor <<'EOF'
          @page "/inventory/intelligence"
          @attribute [Authorize(Roles = "Administrator,Manager,InventoryStaff")]
          @inject IRetailApiClient RetailApi
          @inject IInventoryIntelligenceApiClient IntelligenceApi

          <PageTitle>Inventory Intelligence - OUTFITTERS</PageTitle>

          <div class="page-heading">
              <div>
                  <span class="eyebrow">Inventory planning</span>
                  <h1>Inventory Intelligence</h1>
                  <p>Forecast demand, identify risk, and create reorder recommendations.</p>
              </div>

              <button
                  type="button"
                  class="primary-button compact"
                  @onclick="LoadAsync">
                  Refresh
              </button>
          </div>

          <section class="page-card intelligence-filter">
              <label>
                  Store
                  <select @bind="_selectedStoreId" @onchange="StoreChanged">
                      <option value="">All stores</option>
                      @foreach (var store in _stores)
                      {
                          <option value="@store.Id">@store.Name</option>
                      }
                  </select>
              </label>
          </section>

          <div class="metric-grid intelligence-metrics">
              <article class="metric-card">
                  <span>Inventory Value</span>
                  <strong>@_summary.TotalInventoryValue.ToString("C")</strong>
              </article>

              <article class="metric-card alert-card">
                  <span>Low Stock</span>
                  <strong>@_summary.LowStockItemCount</strong>
              </article>

              <article class="metric-card alert-card">
                  <span>Out of Stock</span>
                  <strong>@_summary.OutOfStockItemCount</strong>
              </article>

              <article class="metric-card">
                  <span>Dead Stock</span>
                  <strong>@_summary.DeadStockItemCount</strong>
              </article>

              <article class="metric-card">
                  <span>Reorder Suggestions</span>
                  <strong>@_summary.ReorderSuggestionCount</strong>
              </article>

              <article class="metric-card">
                  <span>30-Day Demand</span>
                  <strong>@_summary.EstimatedThirtyDayDemand.ToString("0.##")</strong>
              </article>
          </div>

          <section class="page-card intelligence-section">
              <div class="section-heading">
                  <div>
                      <span class="eyebrow">Action required</span>
                      <h2>Reorder Suggestions</h2>
                  </div>

                  <button
                      type="button"
                      class="primary-button compact"
                      disabled="@(!_selectedRecommendationIds.Any() || _creatingRecommendation)"
                      @onclick="CreateRecommendationAsync">
                      @(_creatingRecommendation
                          ? "Creating..."
                          : "Create Purchase Recommendation")
                  </button>
              </div>

              <div class="data-table">
                  <div class="table-row table-header reorder-table">
                      <span>Select</span>
                      <span>Product</span>
                      <span>Store</span>
                      <span>Supplier</span>
                      <span>On Hand</span>
                      <span>Suggested</span>
                      <span>Est. Value</span>
                  </div>

                  @foreach (var item in _summary.ReorderSuggestions)
                  {
                      <div class="table-row reorder-table">
                          <span>
                              <input
                                  type="checkbox"
                                  checked="@_selectedRecommendationIds.Contains(item.ProductVariantId)"
                                  @onchange="args => ToggleRecommendation(item.ProductVariantId, args)" />
                          </span>
                          <span>
                              <strong>@item.ProductName</strong>
                              <small>@item.VariantName</small>
                          </span>
                          <span>@item.StoreName</span>
                          <span>@item.SupplierName</span>
                          <span>@item.QuantityOnHand.ToString("0.##")</span>
                          <span>@item.SuggestedOrderQuantity.ToString("0.##")</span>
                          <strong>@item.EstimatedOrderValue.ToString("C")</strong>
                      </div>
                  }

                  @if (_summary.ReorderSuggestions.Count == 0)
                  {
                      <div class="empty-state">No reorder suggestions are available.</div>
                  }
              </div>

              @if (!string.IsNullOrWhiteSpace(_message))
              {
                  <div class="@(_success ? "success-message" : "error-message")">
                      @_message
                  </div>
              }
          </section>

          <section class="page-card intelligence-section">
              <div class="section-heading">
                  <h2>Fast-Moving Items</h2>
              </div>

              <div class="data-table">
                  <div class="table-row table-header intelligence-table">
                      <span>Product</span>
                      <span>Store</span>
                      <span>30-Day Sales</span>
                      <span>Days of Cover</span>
                      <span>ABC Class</span>
                  </div>

                  @foreach (var item in _summary.FastMovingItems)
                  {
                      <div class="table-row intelligence-table">
                          <span>
                              <strong>@item.ProductName</strong>
                              <small>@item.VariantName</small>
                          </span>
                          <span>@item.StoreName</span>
                          <span>@item.UnitsSoldThirtyDays.ToString("0.##")</span>
                          <span>@item.DaysOfCover.ToString("0.##")</span>
                          <span class="classification-badge class-@item.Classification.ToLowerInvariant()">
                              @item.Classification
                          </span>
                      </div>
                  }

                  @if (_summary.FastMovingItems.Count == 0)
                  {
                      <div class="empty-state">No fast-moving item data is available.</div>
                  }
              </div>
          </section>

          <section class="page-card intelligence-section">
              <div class="section-heading">
                  <h2>Dead Stock</h2>
              </div>

              <div class="data-table">
                  <div class="table-row table-header intelligence-table">
                      <span>Product</span>
                      <span>Store</span>
                      <span>On Hand</span>
                      <span>30-Day Sales</span>
                      <span>ABC Class</span>
                  </div>

                  @foreach (var item in _summary.DeadStockItems)
                  {
                      <div class="table-row intelligence-table">
                          <span>
                              <strong>@item.ProductName</strong>
                              <small>@item.VariantName</small>
                          </span>
                          <span>@item.StoreName</span>
                          <span>@item.QuantityOnHand.ToString("0.##")</span>
                          <span>@item.UnitsSoldThirtyDays.ToString("0.##")</span>
                          <span class="classification-badge class-@item.Classification.ToLowerInvariant()">
                              @item.Classification
                          </span>
                      </div>
                  }

                  @if (_summary.DeadStockItems.Count == 0)
                  {
                      <div class="empty-state">No dead-stock items were detected.</div>
                  }
              </div>
          </section>

          <section class="page-card intelligence-section">
              <div class="section-heading">
                  <h2>Branch Comparison</h2>
              </div>

              <div class="data-table">
                  <div class="table-row table-header branch-table">
                      <span>Store</span>
                      <span>Inventory Value</span>
                      <span>Active SKUs</span>
                      <span>Low Stock</span>
                      <span>Out of Stock</span>
                      <span>Sell-Through</span>
                  </div>

                  @foreach (var item in _summary.BranchComparison)
                  {
                      <div class="table-row branch-table">
                          <strong>@item.StoreName</strong>
                          <span>@item.InventoryValue.ToString("C")</span>
                          <span>@item.ActiveSkuCount</span>
                          <span>@item.LowStockCount</span>
                          <span>@item.OutOfStockCount</span>
                          <span>@item.ThirtyDaySellThroughRate.ToString("0.##")%</span>
                      </div>
                  }

                  @if (_summary.BranchComparison.Count == 0)
                  {
                      <div class="empty-state">No branch comparison data is available.</div>
                  }
              </div>
          </section>

          @code {
              private IReadOnlyCollection<StoreListItem> _stores =
                  Array.Empty<StoreListItem>();

              private InventoryIntelligenceSummary _summary = new();
              private readonly HashSet<Guid> _selectedRecommendationIds = new();
              private Guid? _selectedStoreId;
              private bool _creatingRecommendation;
              private bool _success;
              private string? _message;

              protected override async Task OnInitializedAsync()
              {
                  _stores = await RetailApi.GetStoresAsync();
                  await LoadAsync();
              }

              private async Task StoreChanged(ChangeEventArgs _)
              {
                  await LoadAsync();
              }

              private async Task LoadAsync()
              {
                  _message = null;
                  _selectedRecommendationIds.Clear();
                  _summary = await IntelligenceApi.GetSummaryAsync(_selectedStoreId);
              }

              private void ToggleRecommendation(
                  Guid productVariantId,
                  ChangeEventArgs args)
              {
                  var selected = args.Value is bool value && value;

                  if (selected)
                  {
                      _selectedRecommendationIds.Add(productVariantId);
                  }
                  else
                  {
                      _selectedRecommendationIds.Remove(productVariantId);
                  }
              }

              private async Task CreateRecommendationAsync()
              {
                  _message = null;
                  _success = false;

                  if (!_selectedStoreId.HasValue)
                  {
                      _message = "Select a specific store first.";
                      return;
                  }

                  var selectedLines = _summary.ReorderSuggestions
                      .Where(x => _selectedRecommendationIds.Contains(x.ProductVariantId))
                      .Select(x => new CreatePurchaseRecommendationLine
                      {
                          ProductVariantId = x.ProductVariantId,
                          Quantity = x.SuggestedOrderQuantity
                      })
                      .ToArray();

                  if (selectedLines.Length == 0)
                  {
                      _message = "Select at least one recommendation.";
                      return;
                  }

                  _creatingRecommendation = true;

                  _success = await IntelligenceApi.CreatePurchaseRecommendationAsync(
                      new CreatePurchaseRecommendationRequest
                      {
                          StoreId = _selectedStoreId.Value,
                          Lines = selectedLines
                      });

                  _creatingRecommendation = false;
                  _message = _success
                      ? "Purchase recommendation created successfully."
                      : "The purchase recommendation could not be created.";

                  if (_success)
                  {
                      _selectedRecommendationIds.Clear();
                  }
              }
          }
          EOF

      - name: Update navigation and styles
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Outfitters.Web/Components/Layout/MainLayout.razor")
          text = path.read_text()

          link = (
              '<NavLink href="/inventory/intelligence">'
              'Inventory Intelligence</NavLink>'
          )

          if link not in text:
              marker = '<NavLink href="/inventory">Inventory</NavLink>'
              text = text.replace(
                  marker,
                  marker + "\n                      " + link,
                  1
              )

          path.write_text(text)
          PY

          cat >> src/Outfitters.Web/wwwroot/css/site.css <<'EOF'

          .intelligence-filter {
              margin-bottom: 18px;
          }

          .intelligence-filter label {
              display: grid;
              gap: 8px;
              width: min(100%, 360px);
              color: #c6c8ce;
          }

          .intelligence-filter select {
              width: 100%;
              padding: 12px 14px;
              border: 1px solid #343740;
              border-radius: 10px;
              color: #fff;
              background: #111317;
          }

          .intelligence-metrics {
              margin-bottom: 18px;
          }

          .intelligence-section {
              margin-bottom: 18px;
              padding: 0;
              overflow: hidden;
          }

          .intelligence-section .section-heading {
              padding: 18px;
          }

          .reorder-table {
              grid-template-columns:
                  70px
                  minmax(180px, 1.5fr)
                  minmax(110px, 1fr)
                  minmax(130px, 1fr)
                  90px
                  100px
                  110px;
          }

          .intelligence-table {
              grid-template-columns:
                  minmax(200px, 1.6fr)
                  minmax(120px, 1fr)
                  110px
                  110px
                  90px;
          }

          .branch-table {
              grid-template-columns:
                  minmax(160px, 1.4fr)
                  130px
                  100px
                  100px
                  100px
                  110px;
          }

          .classification-badge {
              width: 34px;
              height: 34px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              border-radius: 999px;
              font-weight: 900;
          }

          .class-a {
              color: #a8efc8;
              background: #173625;
          }

          .class-b {
              color: #ffd39a;
              background: #422d15;
          }

          .class-c {
              color: #c6c8ce;
              background: #30333a;
          }

          @media (max-width: 980px) {
              .reorder-table,
              .intelligence-table,
              .branch-table {
                  grid-template-columns: 1fr;
              }

              .reorder-table.table-header,
              .intelligence-table.table-header,
              .branch-table.table-header {
                  display: none;
              }
          }
          EOF

      - name: Normalize Razor directives
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/Outfitters.Web")
          pattern = re.compile(
              r"^\s*@(page|attribute|inject|using|namespace|inherits|layout|"
              r"implements|typeparam|rendermode)\b"
          )

          for path in root.rglob("*.razor"):
              lines = path.read_text(encoding="utf-8-sig").splitlines()
              normalized = [
                  line.lstrip() if pattern.match(line) else line
                  for line in lines
              ]

              path.write_text(
                  "\n".join(normalized).rstrip() + "\n",
                  encoding="utf-8"
              )
          PY

      - name: Restore build and test
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore OutfittersRetailManagementSystem.sln

          dotnet build OutfittersRetailManagementSystem.sln \
            --configuration Release \
            --no-restore

          dotnet test OutfittersRetailManagementSystem.sln \
            --configuration Release \
            --no-build

      - name: Commit milestone 17
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/Outfitters.Web

          if git diff --cached --quiet
          then
            echo "Milestone 17 is already committed."
            exit 0
          fi

          git commit -m \
            "Milestone 17 - Add inventory intelligence dashboard"

          for attempt in 1 2 3
          do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main
            then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]
            then
              sleep 5
            fi
          done

          echo "Unable to push Milestone 17 after three attempts."
          exit 1
