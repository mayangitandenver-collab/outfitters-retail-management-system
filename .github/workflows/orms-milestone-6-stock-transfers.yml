name: ORMS Milestone 6 - Multi-Store Stock Transfers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  milestone6:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Write stock transfer domain model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/Outfitters.Domain/Entities
          mkdir -p src/Outfitters.Domain/Enums
          mkdir -p src/Outfitters.Application/Transfers
          mkdir -p src/Outfitters.API/Controllers

          cat > src/Outfitters.Domain/Enums/StockTransferStatus.cs <<'EOF'
          namespace Outfitters.Domain.Enums;

          public enum StockTransferStatus
          {
              Draft = 1,
              Submitted = 2,
              InTransit = 3,
              PartiallyReceived = 4,
              FullyReceived = 5,
              Cancelled = 6
          }
          EOF

          cat > src/Outfitters.Domain/Entities/StockTransfer.cs <<'EOF'
          using Outfitters.Domain.Common;
          using Outfitters.Domain.Enums;

          namespace Outfitters.Domain.Entities;

          public sealed class StockTransfer : BaseEntity
          {
              public string TransferNumber { get; set; } = string.Empty;
              public Guid SourceStoreId { get; set; }
              public Store SourceStore { get; set; } = null!;
              public Guid DestinationStoreId { get; set; }
              public Store DestinationStore { get; set; } = null!;
              public Guid CreatedByUserId { get; set; }
              public ApplicationUser CreatedByUser { get; set; } = null!;
              public Guid? DispatchedByUserId { get; set; }
              public ApplicationUser? DispatchedByUser { get; set; }
              public Guid? ReceivedByUserId { get; set; }
              public ApplicationUser? ReceivedByUser { get; set; }
              public DateTime TransferDateUtc { get; set; } = DateTime.UtcNow;
              public DateTime? DispatchedAtUtc { get; set; }
              public DateTime? ReceivedAtUtc { get; set; }
              public StockTransferStatus Status { get; set; } = StockTransferStatus.Draft;
              public string? Notes { get; set; }
              public ICollection<StockTransferItem> Items { get; set; } = new List<StockTransferItem>();
              public ICollection<StockTransferReceipt> Receipts { get; set; } = new List<StockTransferReceipt>();
          }
          EOF

          cat > src/Outfitters.Domain/Entities/StockTransferItem.cs <<'EOF'
          using Outfitters.Domain.Common;

          namespace Outfitters.Domain.Entities;

          public sealed class StockTransferItem : BaseEntity
          {
              public Guid StockTransferId { get; set; }
              public StockTransfer StockTransfer { get; set; } = null!;
              public Guid ProductVariantId { get; set; }
              public ProductVariant ProductVariant { get; set; } = null!;
              public decimal RequestedQuantity { get; set; }
              public decimal DispatchedQuantity { get; set; }
              public decimal ReceivedQuantity { get; set; }
              public decimal DamagedQuantity { get; set; }
          }
          EOF

          cat > src/Outfitters.Domain/Entities/StockTransferReceipt.cs <<'EOF'
          using Outfitters.Domain.Common;

          namespace Outfitters.Domain.Entities;

          public sealed class StockTransferReceipt : BaseEntity
          {
              public string ReceiptNumber { get; set; } = string.Empty;
              public Guid StockTransferId { get; set; }
              public StockTransfer StockTransfer { get; set; } = null!;
              public Guid ReceivedByUserId { get; set; }
              public ApplicationUser ReceivedByUser { get; set; } = null!;
              public DateTime ReceivedAtUtc { get; set; } = DateTime.UtcNow;
              public string? Notes { get; set; }
              public ICollection<StockTransferReceiptItem> Items { get; set; } =
                  new List<StockTransferReceiptItem>();
          }
          EOF

          cat > src/Outfitters.Domain/Entities/StockTransferReceiptItem.cs <<'EOF'
          using Outfitters.Domain.Common;

          namespace Outfitters.Domain.Entities;

          public sealed class StockTransferReceiptItem : BaseEntity
          {
              public Guid StockTransferReceiptId { get; set; }
              public StockTransferReceipt StockTransferReceipt { get; set; } = null!;
              public Guid StockTransferItemId { get; set; }
              public StockTransferItem StockTransferItem { get; set; } = null!;
              public Guid ProductVariantId { get; set; }
              public ProductVariant ProductVariant { get; set; } = null!;
              public decimal QuantityReceived { get; set; }
              public decimal QuantityDamaged { get; set; }
          }
          EOF

      - name: Write transfer contracts
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Application/Transfers/TransferContracts.cs <<'EOF'
          namespace Outfitters.Application.Transfers;

          public sealed record StockTransferItemRequest(
              Guid ProductVariantId,
              decimal RequestedQuantity);

          public sealed record CreateStockTransferRequest(
              Guid SourceStoreId,
              Guid DestinationStoreId,
              string? Notes,
              IReadOnlyCollection<StockTransferItemRequest> Items);

          public sealed record DispatchTransferItemRequest(
              Guid StockTransferItemId,
              decimal QuantityToDispatch);

          public sealed record DispatchStockTransferRequest(
              string? Notes,
              IReadOnlyCollection<DispatchTransferItemRequest> Items);

          public sealed record ReceiveTransferItemRequest(
              Guid StockTransferItemId,
              decimal QuantityReceived,
              decimal QuantityDamaged);

          public sealed record ReceiveStockTransferRequest(
              string? Notes,
              IReadOnlyCollection<ReceiveTransferItemRequest> Items);
          EOF

      - name: Replace database context with transfer model
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.Infrastructure/Persistence/ApplicationDbContext.cs <<'EOF'
          using Microsoft.AspNetCore.Identity.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore;
          using Outfitters.Domain.Entities;

          namespace Outfitters.Infrastructure.Persistence;

          public sealed class ApplicationDbContext
              : IdentityDbContext<ApplicationUser, ApplicationRole, Guid>
          {
              public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options)
                  : base(options)
              {
              }

              public DbSet<Company> Companies => Set<Company>();
              public DbSet<Store> Stores => Set<Store>();
              public DbSet<Category> Categories => Set<Category>();
              public DbSet<Brand> Brands => Set<Brand>();
              public DbSet<Product> Products => Set<Product>();
              public DbSet<ProductVariant> ProductVariants => Set<ProductVariant>();
              public DbSet<InventoryItem> InventoryItems => Set<InventoryItem>();
              public DbSet<InventoryTransaction> InventoryTransactions => Set<InventoryTransaction>();
              public DbSet<CashSession> CashSessions => Set<CashSession>();
              public DbSet<Sale> Sales => Set<Sale>();
              public DbSet<SaleItem> SaleItems => Set<SaleItem>();
              public DbSet<SalePayment> SalePayments => Set<SalePayment>();
              public DbSet<SaleReturn> SaleReturns => Set<SaleReturn>();
              public DbSet<SaleReturnItem> SaleReturnItems => Set<SaleReturnItem>();
              public DbSet<Supplier> Suppliers => Set<Supplier>();
              public DbSet<PurchaseOrder> PurchaseOrders => Set<PurchaseOrder>();
              public DbSet<PurchaseOrderItem> PurchaseOrderItems => Set<PurchaseOrderItem>();
              public DbSet<GoodsReceipt> GoodsReceipts => Set<GoodsReceipt>();
              public DbSet<GoodsReceiptItem> GoodsReceiptItems => Set<GoodsReceiptItem>();
              public DbSet<SupplierReturn> SupplierReturns => Set<SupplierReturn>();
              public DbSet<SupplierReturnItem> SupplierReturnItems => Set<SupplierReturnItem>();
              public DbSet<StockTransfer> StockTransfers => Set<StockTransfer>();
              public DbSet<StockTransferItem> StockTransferItems => Set<StockTransferItem>();
              public DbSet<StockTransferReceipt> StockTransferReceipts => Set<StockTransferReceipt>();
              public DbSet<StockTransferReceiptItem> StockTransferReceiptItems => Set<StockTransferReceiptItem>();

              protected override void OnModelCreating(ModelBuilder builder)
              {
                  base.OnModelCreating(builder);

                  builder.Entity<Company>(entity =>
                  {
                      entity.HasIndex(x => x.Code).IsUnique();
                      entity.Property(x => x.Code).HasMaxLength(30).IsRequired();
                      entity.Property(x => x.Name).HasMaxLength(200).IsRequired();
                  });

                  builder.Entity<Store>(entity =>
                  {
                      entity.HasIndex(x => new { x.CompanyId, x.Code }).IsUnique();
                      entity.Property(x => x.Code).HasMaxLength(30).IsRequired();
                      entity.Property(x => x.Name).HasMaxLength(200).IsRequired();
                      entity.HasOne(x => x.Company).WithMany(x => x.Stores)
                          .HasForeignKey(x => x.CompanyId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<ApplicationUser>(entity =>
                  {
                      entity.Property(x => x.FirstName).HasMaxLength(100).IsRequired();
                      entity.Property(x => x.LastName).HasMaxLength(100).IsRequired();
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.SetNull);
                  });

                  builder.Entity<Category>(entity =>
                  {
                      entity.HasIndex(x => x.Name);
                      entity.Property(x => x.Name).HasMaxLength(150).IsRequired();
                      entity.HasOne(x => x.ParentCategory).WithMany(x => x.Children)
                          .HasForeignKey(x => x.ParentCategoryId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<Brand>(entity =>
                  {
                      entity.HasIndex(x => x.Name).IsUnique();
                      entity.Property(x => x.Name).HasMaxLength(150).IsRequired();
                  });

                  builder.Entity<Product>(entity =>
                  {
                      entity.HasIndex(x => x.Sku).IsUnique();
                      entity.Property(x => x.Sku).HasMaxLength(80).IsRequired();
                      entity.Property(x => x.Name).HasMaxLength(200).IsRequired();
                      entity.HasOne(x => x.Category).WithMany(x => x.Products)
                          .HasForeignKey(x => x.CategoryId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.Brand).WithMany(x => x.Products)
                          .HasForeignKey(x => x.BrandId).OnDelete(DeleteBehavior.SetNull);
                  });

                  builder.Entity<ProductVariant>(entity =>
                  {
                      entity.HasIndex(x => x.VariantSku).IsUnique();
                      entity.HasIndex(x => x.Barcode).IsUnique();
                      entity.Property(x => x.VariantSku).HasMaxLength(100).IsRequired();
                      entity.Property(x => x.Barcode).HasMaxLength(100).IsRequired();
                      entity.Property(x => x.CostPrice).HasPrecision(18, 2);
                      entity.Property(x => x.SellingPrice).HasPrecision(18, 2);
                      entity.HasOne(x => x.Product).WithMany(x => x.Variants)
                          .HasForeignKey(x => x.ProductId).OnDelete(DeleteBehavior.Cascade);
                  });

                  builder.Entity<InventoryItem>(entity =>
                  {
                      entity.HasIndex(x => new { x.StoreId, x.ProductVariantId }).IsUnique();
                      entity.Property(x => x.QuantityOnHand).HasPrecision(18, 3);
                      entity.Property(x => x.ReservedQuantity).HasPrecision(18, 3);
                      entity.Property(x => x.ReorderPoint).HasPrecision(18, 3);
                      entity.Property(x => x.MinimumStock).HasPrecision(18, 3);
                      entity.Property(x => x.MaximumStock).HasPrecision(18, 3);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ProductVariant).WithMany(x => x.InventoryItems)
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                      entity.Ignore(x => x.AvailableQuantity);
                  });

                  builder.Entity<InventoryTransaction>(entity =>
                  {
                      entity.Property(x => x.QuantityChange).HasPrecision(18, 3);
                      entity.Property(x => x.BalanceAfter).HasPrecision(18, 3);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.CreatedByUser).WithMany()
                          .HasForeignKey(x => x.CreatedByUserId).OnDelete(DeleteBehavior.SetNull);
                  });

                  builder.Entity<CashSession>(entity =>
                  {
                      entity.Property(x => x.OpeningCash).HasPrecision(18, 2);
                      entity.Property(x => x.ClosingCash).HasPrecision(18, 2);
                      entity.Property(x => x.ExpectedCash).HasPrecision(18, 2);
                      entity.Property(x => x.CashVariance).HasPrecision(18, 2);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.OpenedByUser).WithMany()
                          .HasForeignKey(x => x.OpenedByUserId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ClosedByUser).WithMany()
                          .HasForeignKey(x => x.ClosedByUserId).OnDelete(DeleteBehavior.SetNull);
                  });

                  builder.Entity<Sale>(entity =>
                  {
                      entity.HasIndex(x => x.ReceiptNumber).IsUnique();
                      entity.Property(x => x.ReceiptNumber).HasMaxLength(50).IsRequired();
                      entity.Property(x => x.Subtotal).HasPrecision(18, 2);
                      entity.Property(x => x.DiscountTotal).HasPrecision(18, 2);
                      entity.Property(x => x.TaxTotal).HasPrecision(18, 2);
                      entity.Property(x => x.GrandTotal).HasPrecision(18, 2);
                      entity.Property(x => x.AmountPaid).HasPrecision(18, 2);
                      entity.Property(x => x.ChangeDue).HasPrecision(18, 2);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.CashSession).WithMany(x => x.Sales)
                          .HasForeignKey(x => x.CashSessionId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.CashierUser).WithMany()
                          .HasForeignKey(x => x.CashierUserId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<SaleItem>(entity =>
                  {
                      entity.Property(x => x.Quantity).HasPrecision(18, 3);
                      entity.Property(x => x.UnitPrice).HasPrecision(18, 2);
                      entity.Property(x => x.DiscountAmount).HasPrecision(18, 2);
                      entity.Property(x => x.TaxAmount).HasPrecision(18, 2);
                      entity.Property(x => x.LineTotal).HasPrecision(18, 2);
                      entity.Property(x => x.ReturnedQuantity).HasPrecision(18, 3);
                      entity.HasOne(x => x.Sale).WithMany(x => x.Items)
                          .HasForeignKey(x => x.SaleId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<SalePayment>(entity =>
                  {
                      entity.Property(x => x.Amount).HasPrecision(18, 2);
                      entity.HasOne(x => x.Sale).WithMany(x => x.Payments)
                          .HasForeignKey(x => x.SaleId).OnDelete(DeleteBehavior.Cascade);
                  });

                  builder.Entity<SaleReturn>(entity =>
                  {
                      entity.HasIndex(x => x.ReturnNumber).IsUnique();
                      entity.Property(x => x.ReturnNumber).HasMaxLength(50).IsRequired();
                      entity.Property(x => x.RefundAmount).HasPrecision(18, 2);
                      entity.HasOne(x => x.Sale).WithMany()
                          .HasForeignKey(x => x.SaleId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ProcessedByUser).WithMany()
                          .HasForeignKey(x => x.ProcessedByUserId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<SaleReturnItem>(entity =>
                  {
                      entity.Property(x => x.Quantity).HasPrecision(18, 3);
                      entity.Property(x => x.RefundAmount).HasPrecision(18, 2);
                      entity.HasOne(x => x.SaleReturn).WithMany(x => x.Items)
                          .HasForeignKey(x => x.SaleReturnId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.SaleItem).WithMany()
                          .HasForeignKey(x => x.SaleItemId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<Supplier>(entity =>
                  {
                      entity.HasIndex(x => x.Code).IsUnique();
                      entity.HasIndex(x => x.Name);
                      entity.Property(x => x.Code).HasMaxLength(50).IsRequired();
                      entity.Property(x => x.Name).HasMaxLength(200).IsRequired();
                      entity.Property(x => x.Email).HasMaxLength(250);
                      entity.Property(x => x.Phone).HasMaxLength(50);
                  });

                  builder.Entity<PurchaseOrder>(entity =>
                  {
                      entity.HasIndex(x => x.PurchaseOrderNumber).IsUnique();
                      entity.Property(x => x.PurchaseOrderNumber).HasMaxLength(50).IsRequired();
                      entity.Property(x => x.Subtotal).HasPrecision(18, 2);
                      entity.Property(x => x.DiscountTotal).HasPrecision(18, 2);
                      entity.Property(x => x.TaxTotal).HasPrecision(18, 2);
                      entity.Property(x => x.GrandTotal).HasPrecision(18, 2);
                      entity.HasOne(x => x.Supplier).WithMany(x => x.PurchaseOrders)
                          .HasForeignKey(x => x.SupplierId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.CreatedByUser).WithMany()
                          .HasForeignKey(x => x.CreatedByUserId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<PurchaseOrderItem>(entity =>
                  {
                      entity.HasIndex(x => new { x.PurchaseOrderId, x.ProductVariantId }).IsUnique();
                      entity.Property(x => x.OrderedQuantity).HasPrecision(18, 3);
                      entity.Property(x => x.ReceivedQuantity).HasPrecision(18, 3);
                      entity.Property(x => x.UnitCost).HasPrecision(18, 2);
                      entity.Property(x => x.DiscountAmount).HasPrecision(18, 2);
                      entity.Property(x => x.TaxAmount).HasPrecision(18, 2);
                      entity.Property(x => x.LineTotal).HasPrecision(18, 2);
                      entity.HasOne(x => x.PurchaseOrder).WithMany(x => x.Items)
                          .HasForeignKey(x => x.PurchaseOrderId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<GoodsReceipt>(entity =>
                  {
                      entity.HasIndex(x => x.ReceiptNumber).IsUnique();
                      entity.Property(x => x.ReceiptNumber).HasMaxLength(50).IsRequired();
                      entity.HasOne(x => x.PurchaseOrder).WithMany(x => x.GoodsReceipts)
                          .HasForeignKey(x => x.PurchaseOrderId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ReceivedByUser).WithMany()
                          .HasForeignKey(x => x.ReceivedByUserId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<GoodsReceiptItem>(entity =>
                  {
                      entity.Property(x => x.QuantityReceived).HasPrecision(18, 3);
                      entity.Property(x => x.UnitCost).HasPrecision(18, 2);
                      entity.HasOne(x => x.GoodsReceipt).WithMany(x => x.Items)
                          .HasForeignKey(x => x.GoodsReceiptId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.PurchaseOrderItem).WithMany()
                          .HasForeignKey(x => x.PurchaseOrderItemId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<SupplierReturn>(entity =>
                  {
                      entity.HasIndex(x => x.ReturnNumber).IsUnique();
                      entity.Property(x => x.ReturnNumber).HasMaxLength(50).IsRequired();
                      entity.Property(x => x.TotalCost).HasPrecision(18, 2);
                      entity.HasOne(x => x.Supplier).WithMany()
                          .HasForeignKey(x => x.SupplierId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.Store).WithMany()
                          .HasForeignKey(x => x.StoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ProcessedByUser).WithMany()
                          .HasForeignKey(x => x.ProcessedByUserId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<SupplierReturnItem>(entity =>
                  {
                      entity.Property(x => x.Quantity).HasPrecision(18, 3);
                      entity.Property(x => x.UnitCost).HasPrecision(18, 2);
                      entity.Property(x => x.LineTotal).HasPrecision(18, 2);
                      entity.HasOne(x => x.SupplierReturn).WithMany(x => x.Items)
                          .HasForeignKey(x => x.SupplierReturnId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<StockTransfer>(entity =>
                  {
                      entity.HasIndex(x => x.TransferNumber).IsUnique();
                      entity.Property(x => x.TransferNumber).HasMaxLength(50).IsRequired();
                      entity.HasOne(x => x.SourceStore).WithMany()
                          .HasForeignKey(x => x.SourceStoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.DestinationStore).WithMany()
                          .HasForeignKey(x => x.DestinationStoreId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.CreatedByUser).WithMany()
                          .HasForeignKey(x => x.CreatedByUserId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.DispatchedByUser).WithMany()
                          .HasForeignKey(x => x.DispatchedByUserId).OnDelete(DeleteBehavior.SetNull);
                      entity.HasOne(x => x.ReceivedByUser).WithMany()
                          .HasForeignKey(x => x.ReceivedByUserId).OnDelete(DeleteBehavior.SetNull);
                  });

                  builder.Entity<StockTransferItem>(entity =>
                  {
                      entity.HasIndex(x => new { x.StockTransferId, x.ProductVariantId }).IsUnique();
                      entity.Property(x => x.RequestedQuantity).HasPrecision(18, 3);
                      entity.Property(x => x.DispatchedQuantity).HasPrecision(18, 3);
                      entity.Property(x => x.ReceivedQuantity).HasPrecision(18, 3);
                      entity.Property(x => x.DamagedQuantity).HasPrecision(18, 3);
                      entity.HasOne(x => x.StockTransfer).WithMany(x => x.Items)
                          .HasForeignKey(x => x.StockTransferId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<StockTransferReceipt>(entity =>
                  {
                      entity.HasIndex(x => x.ReceiptNumber).IsUnique();
                      entity.Property(x => x.ReceiptNumber).HasMaxLength(50).IsRequired();
                      entity.HasOne(x => x.StockTransfer).WithMany(x => x.Receipts)
                          .HasForeignKey(x => x.StockTransferId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ReceivedByUser).WithMany()
                          .HasForeignKey(x => x.ReceivedByUserId).OnDelete(DeleteBehavior.Restrict);
                  });

                  builder.Entity<StockTransferReceiptItem>(entity =>
                  {
                      entity.Property(x => x.QuantityReceived).HasPrecision(18, 3);
                      entity.Property(x => x.QuantityDamaged).HasPrecision(18, 3);
                      entity.HasOne(x => x.StockTransferReceipt).WithMany(x => x.Items)
                          .HasForeignKey(x => x.StockTransferReceiptId).OnDelete(DeleteBehavior.Cascade);
                      entity.HasOne(x => x.StockTransferItem).WithMany()
                          .HasForeignKey(x => x.StockTransferItemId).OnDelete(DeleteBehavior.Restrict);
                      entity.HasOne(x => x.ProductVariant).WithMany()
                          .HasForeignKey(x => x.ProductVariantId).OnDelete(DeleteBehavior.Restrict);
                  });
              }
          }
          EOF

      - name: Write stock transfer controller
        shell: bash
        run: |
          set -euo pipefail

          cat > src/Outfitters.API/Controllers/StockTransfersController.cs <<'EOF'
          using System.Globalization;
          using System.Security.Claims;
          using Microsoft.AspNetCore.Authorization;
          using Microsoft.AspNetCore.Mvc;
          using Microsoft.EntityFrameworkCore;
          using Outfitters.Application.Transfers;
          using Outfitters.Domain.Entities;
          using Outfitters.Domain.Enums;
          using Outfitters.Infrastructure.Persistence;

          namespace Outfitters.API.Controllers;

          [ApiController]
          [Authorize(Roles = "SuperAdministrator,Administrator,StoreManager,InventoryClerk")]
          [Route("api/stock-transfers")]
          public sealed class StockTransfersController : ControllerBase
          {
              private readonly ApplicationDbContext _db;

              public StockTransfersController(ApplicationDbContext db) => _db = db;

              [HttpGet]
              public async Task<IActionResult> GetAll(
                  [FromQuery] Guid? sourceStoreId,
                  [FromQuery] Guid? destinationStoreId,
                  [FromQuery] StockTransferStatus? status)
              {
                  var query = _db.StockTransfers
                      .AsNoTracking()
                      .Include(x => x.SourceStore)
                      .Include(x => x.DestinationStore)
                      .AsQueryable();

                  if (sourceStoreId.HasValue)
                  {
                      query = query.Where(x => x.SourceStoreId == sourceStoreId.Value);
                  }

                  if (destinationStoreId.HasValue)
                  {
                      query = query.Where(x => x.DestinationStoreId == destinationStoreId.Value);
                  }

                  if (status.HasValue)
                  {
                      query = query.Where(x => x.Status == status.Value);
                  }

                  var result = await query
                      .OrderByDescending(x => x.TransferDateUtc)
                      .Select(x => new
                      {
                          x.Id,
                          x.TransferNumber,
                          SourceStore = x.SourceStore.Name,
                          DestinationStore = x.DestinationStore.Name,
                          x.TransferDateUtc,
                          x.DispatchedAtUtc,
                          x.ReceivedAtUtc,
                          x.Status
                      })
                      .ToListAsync();

                  return Ok(result);
              }

              [HttpGet("{id:guid}")]
              public async Task<IActionResult> Get(Guid id)
              {
                  var result = await _db.StockTransfers
                      .AsNoTracking()
                      .Where(x => x.Id == id)
                      .Select(x => new
                      {
                          x.Id,
                          x.TransferNumber,
                          x.SourceStoreId,
                          x.DestinationStoreId,
                          x.Status,
                          x.TransferDateUtc,
                          x.DispatchedAtUtc,
                          x.ReceivedAtUtc,
                          x.Notes,
                          Items = x.Items.Select(i => new
                          {
                              i.Id,
                              i.ProductVariantId,
                              i.RequestedQuantity,
                              i.DispatchedQuantity,
                              i.ReceivedQuantity,
                              i.DamagedQuantity,
                              InTransitQuantity =
                                  i.DispatchedQuantity - i.ReceivedQuantity - i.DamagedQuantity
                          })
                      })
                      .SingleOrDefaultAsync();

                  return result is null ? NotFound() : Ok(result);
              }

              [HttpPost]
              public async Task<IActionResult> Create(CreateStockTransferRequest request)
              {
                  if (request.SourceStoreId == request.DestinationStoreId)
                  {
                      return BadRequest("Source and destination stores must be different.");
                  }

                  if (request.Items.Count == 0)
                  {
                      return BadRequest("At least one transfer item is required.");
                  }

                  var storeCount = await _db.Stores.CountAsync(x =>
                      (x.Id == request.SourceStoreId || x.Id == request.DestinationStoreId) &&
                      x.IsActive);

                  if (storeCount != 2)
                  {
                      return BadRequest("One or both stores were not found.");
                  }

                  var variantIds = request.Items.Select(x => x.ProductVariantId).Distinct().ToArray();
                  if (variantIds.Length != request.Items.Count)
                  {
                      return BadRequest("Duplicate product variants are not allowed.");
                  }

                  var transfer = new StockTransfer
                  {
                      TransferNumber = await GenerateTransferNumber(),
                      SourceStoreId = request.SourceStoreId,
                      DestinationStoreId = request.DestinationStoreId,
                      CreatedByUserId = GetUserId(),
                      Status = StockTransferStatus.Submitted,
                      Notes = request.Notes?.Trim()
                  };

                  foreach (var item in request.Items)
                  {
                      if (item.RequestedQuantity <= 0)
                      {
                          return BadRequest("Requested quantity must be greater than zero.");
                      }

                      if (!await _db.ProductVariants.AnyAsync(x =>
                          x.Id == item.ProductVariantId && x.IsActive))
                      {
                          return BadRequest("A product variant was not found.");
                      }

                      transfer.Items.Add(new StockTransferItem
                      {
                          ProductVariantId = item.ProductVariantId,
                          RequestedQuantity = item.RequestedQuantity
                      });
                  }

                  _db.StockTransfers.Add(transfer);
                  await _db.SaveChangesAsync();

                  return Ok(new
                  {
                      transfer.Id,
                      transfer.TransferNumber,
                      transfer.Status
                  });
              }

              [HttpPost("{id:guid}/dispatch")]
              public async Task<IActionResult> Dispatch(
                  Guid id,
                  DispatchStockTransferRequest request)
              {
                  if (request.Items.Count == 0)
                  {
                      return BadRequest("At least one dispatch item is required.");
                  }

                  var transfer = await _db.StockTransfers
                      .Include(x => x.Items)
                      .SingleOrDefaultAsync(x => x.Id == id);

                  if (transfer is null)
                  {
                      return NotFound();
                  }

                  if (transfer.Status is StockTransferStatus.Cancelled or
                      StockTransferStatus.InTransit or
                      StockTransferStatus.PartiallyReceived or
                      StockTransferStatus.FullyReceived)
                  {
                      return BadRequest("This transfer cannot be dispatched.");
                  }

                  await using var dbTransaction = await _db.Database.BeginTransactionAsync();

                  foreach (var requested in request.Items)
                  {
                      var transferItem = transfer.Items.SingleOrDefault(x =>
                          x.Id == requested.StockTransferItemId);

                      if (transferItem is null)
                      {
                          return BadRequest("Transfer item was not found.");
                      }

                      if (requested.QuantityToDispatch <= 0 ||
                          requested.QuantityToDispatch > transferItem.RequestedQuantity)
                      {
                          return BadRequest("Dispatch quantity is invalid.");
                      }

                      var sourceInventory = await _db.InventoryItems.SingleOrDefaultAsync(x =>
                          x.StoreId == transfer.SourceStoreId &&
                          x.ProductVariantId == transferItem.ProductVariantId);

                      if (sourceInventory is null ||
                          sourceInventory.QuantityOnHand - sourceInventory.ReservedQuantity <
                          requested.QuantityToDispatch)
                      {
                          return BadRequest("Insufficient source-store inventory.");
                      }

                      sourceInventory.QuantityOnHand -= requested.QuantityToDispatch;
                      sourceInventory.UpdatedAtUtc = DateTime.UtcNow;
                      transferItem.DispatchedQuantity = requested.QuantityToDispatch;

                      _db.InventoryTransactions.Add(new InventoryTransaction
                      {
                          StoreId = transfer.SourceStoreId,
                          ProductVariantId = transferItem.ProductVariantId,
                          TransactionType = InventoryTransactionType.TransferOut,
                          QuantityChange = -requested.QuantityToDispatch,
                          BalanceAfter = sourceInventory.QuantityOnHand,
                          ReferenceNumber = transfer.TransferNumber,
                          Remarks = $"Transfer to store {transfer.DestinationStoreId}",
                          CreatedByUserId = GetUserId()
                      });
                  }

                  transfer.Status = StockTransferStatus.InTransit;
                  transfer.DispatchedAtUtc = DateTime.UtcNow;
                  transfer.DispatchedByUserId = GetUserId();
                  transfer.Notes = string.IsNullOrWhiteSpace(request.Notes)
                      ? transfer.Notes
                      : request.Notes.Trim();
                  transfer.UpdatedAtUtc = DateTime.UtcNow;

                  await _db.SaveChangesAsync();
                  await dbTransaction.CommitAsync();

                  return Ok(new
                  {
                      transfer.Id,
                      transfer.TransferNumber,
                      transfer.Status,
                      transfer.DispatchedAtUtc
                  });
              }

              [HttpPost("{id:guid}/receive")]
              public async Task<IActionResult> Receive(
                  Guid id,
                  ReceiveStockTransferRequest request)
              {
                  if (request.Items.Count == 0)
                  {
                      return BadRequest("At least one receipt item is required.");
                  }

                  var transfer = await _db.StockTransfers
                      .Include(x => x.Items)
                      .SingleOrDefaultAsync(x => x.Id == id);

                  if (transfer is null)
                  {
                      return NotFound();
                  }

                  if (transfer.Status is not
                      (StockTransferStatus.InTransit or StockTransferStatus.PartiallyReceived))
                  {
                      return BadRequest("This transfer is not available for receiving.");
                  }

                  await using var dbTransaction = await _db.Database.BeginTransactionAsync();

                  var receipt = new StockTransferReceipt
                  {
                      ReceiptNumber = await GenerateReceiptNumber(),
                      StockTransferId = transfer.Id,
                      ReceivedByUserId = GetUserId(),
                      Notes = request.Notes?.Trim()
                  };

                  foreach (var requested in request.Items)
                  {
                      var transferItem = transfer.Items.SingleOrDefault(x =>
                          x.Id == requested.StockTransferItemId);

                      if (transferItem is null)
                      {
                          return BadRequest("Transfer item was not found.");
                      }

                      if (requested.QuantityReceived < 0 || requested.QuantityDamaged < 0)
                      {
                          return BadRequest("Received and damaged quantities cannot be negative.");
                      }

                      var remaining = transferItem.DispatchedQuantity -
                          transferItem.ReceivedQuantity -
                          transferItem.DamagedQuantity;

                      var processed = requested.QuantityReceived + requested.QuantityDamaged;
                      if (processed <= 0 || processed > remaining)
                      {
                          return BadRequest("Received quantity exceeds in-transit quantity.");
                      }

                      transferItem.ReceivedQuantity += requested.QuantityReceived;
                      transferItem.DamagedQuantity += requested.QuantityDamaged;

                      receipt.Items.Add(new StockTransferReceiptItem
                      {
                          StockTransferItemId = transferItem.Id,
                          ProductVariantId = transferItem.ProductVariantId,
                          QuantityReceived = requested.QuantityReceived,
                          QuantityDamaged = requested.QuantityDamaged
                      });

                      if (requested.QuantityReceived > 0)
                      {
                          var destinationInventory = await _db.InventoryItems.SingleOrDefaultAsync(x =>
                              x.StoreId == transfer.DestinationStoreId &&
                              x.ProductVariantId == transferItem.ProductVariantId);

                          if (destinationInventory is null)
                          {
                              destinationInventory = new InventoryItem
                              {
                                  StoreId = transfer.DestinationStoreId,
                                  ProductVariantId = transferItem.ProductVariantId
                              };
                              _db.InventoryItems.Add(destinationInventory);
                          }

                          destinationInventory.QuantityOnHand += requested.QuantityReceived;
                          destinationInventory.UpdatedAtUtc = DateTime.UtcNow;

                          _db.InventoryTransactions.Add(new InventoryTransaction
                          {
                              StoreId = transfer.DestinationStoreId,
                              ProductVariantId = transferItem.ProductVariantId,
                              TransactionType = InventoryTransactionType.TransferIn,
                              QuantityChange = requested.QuantityReceived,
                              BalanceAfter = destinationInventory.QuantityOnHand,
                              ReferenceNumber = transfer.TransferNumber,
                              Remarks = $"Transfer received from store {transfer.SourceStoreId}",
                              CreatedByUserId = receipt.ReceivedByUserId
                          });
                      }

                      if (requested.QuantityDamaged > 0)
                      {
                          _db.InventoryTransactions.Add(new InventoryTransaction
                          {
                              StoreId = transfer.DestinationStoreId,
                              ProductVariantId = transferItem.ProductVariantId,
                              TransactionType = InventoryTransactionType.Damage,
                              QuantityChange = 0,
                              BalanceAfter = await GetDestinationBalance(
                                  transfer.DestinationStoreId,
                                  transferItem.ProductVariantId),
                              ReferenceNumber = transfer.TransferNumber,
                              Remarks = $"Damaged in transit: {requested.QuantityDamaged:0.###}",
                              CreatedByUserId = receipt.ReceivedByUserId
                          });
                      }
                  }

                  var fullyProcessed = transfer.Items.All(x =>
                      x.ReceivedQuantity + x.DamagedQuantity >= x.DispatchedQuantity);

                  transfer.Status = fullyProcessed
                      ? StockTransferStatus.FullyReceived
                      : StockTransferStatus.PartiallyReceived;
                  transfer.ReceivedByUserId = receipt.ReceivedByUserId;
                  transfer.ReceivedAtUtc = fullyProcessed ? DateTime.UtcNow : null;
                  transfer.UpdatedAtUtc = DateTime.UtcNow;

                  _db.StockTransferReceipts.Add(receipt);
                  await _db.SaveChangesAsync();
                  await dbTransaction.CommitAsync();

                  return Ok(new
                  {
                      receipt.Id,
                      receipt.ReceiptNumber,
                      transfer.TransferNumber,
                      transfer.Status,
                      receipt.ReceivedAtUtc
                  });
              }

              [HttpGet("{id:guid}/audit")]
              public async Task<IActionResult> Audit(Guid id)
              {
                  var transfer = await _db.StockTransfers
                      .AsNoTracking()
                      .Where(x => x.Id == id)
                      .Select(x => new
                      {
                          x.Id,
                          x.TransferNumber,
                          x.Status,
                          x.TransferDateUtc,
                          x.DispatchedAtUtc,
                          x.ReceivedAtUtc,
                          x.CreatedByUserId,
                          x.DispatchedByUserId,
                          x.ReceivedByUserId,
                          Receipts = x.Receipts
                              .OrderBy(r => r.ReceivedAtUtc)
                              .Select(r => new
                              {
                                  r.Id,
                                  r.ReceiptNumber,
                                  r.ReceivedAtUtc,
                                  r.ReceivedByUserId,
                                  r.Notes,
                                  Items = r.Items.Select(i => new
                                  {
                                      i.ProductVariantId,
                                      i.QuantityReceived,
                                      i.QuantityDamaged
                                  })
                              })
                      })
                      .SingleOrDefaultAsync();

                  return transfer is null ? NotFound() : Ok(transfer);
              }

              private Guid GetUserId()
              {
                  var value = User.FindFirstValue(ClaimTypes.NameIdentifier);
                  return Guid.TryParse(value, out var id)
                      ? id
                      : throw new UnauthorizedAccessException("User identifier is missing.");
              }

              private async Task<decimal> GetDestinationBalance(
                  Guid storeId,
                  Guid productVariantId)
              {
                  return await _db.InventoryItems
                      .Where(x => x.StoreId == storeId &&
                                  x.ProductVariantId == productVariantId)
                      .Select(x => (decimal?)x.QuantityOnHand)
                      .SingleOrDefaultAsync() ?? 0m;
              }

              private async Task<string> GenerateTransferNumber()
              {
                  var datePart = DateTime.UtcNow.ToString("yyyyMMdd", CultureInfo.InvariantCulture);
                  var count = await _db.StockTransfers.CountAsync(x =>
                      x.TransferDateUtc.Date == DateTime.UtcNow.Date);
                  return $"TR-{datePart}-{count + 1:00000}";
              }

              private async Task<string> GenerateReceiptNumber()
              {
                  var datePart = DateTime.UtcNow.ToString("yyyyMMdd", CultureInfo.InvariantCulture);
                  var count = await _db.StockTransferReceipts.CountAsync(x =>
                      x.ReceivedAtUtc.Date == DateTime.UtcNow.Date);
                  return $"TRR-{datePart}-{count + 1:00000}";
              }
          }
