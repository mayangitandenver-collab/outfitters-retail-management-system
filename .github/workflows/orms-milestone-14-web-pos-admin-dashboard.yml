      - name: Commit milestone 14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/Outfitters.Web \
            OutfittersRetailManagementSystem.sln

          if git diff --cached --quiet
          then
            echo "Milestone 14 files are already committed; nothing to push."
            exit 0
          fi

          git commit -m "Milestone 14 - Add web POS and administration dashboard"

          for attempt in 1 2 3
          do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main
            then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]
            then
              sleep 5
            fi
          done

          echo "Unable to push Milestone 14 after three attempts."
          exit 1
